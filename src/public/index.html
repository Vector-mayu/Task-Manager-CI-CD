<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f5f6fa; color: #222; }
    h1 { margin-bottom: 4px; }
    .stats { color: #555; margin-bottom: 20px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input, select, button { padding: 10px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
    input[type=text] { flex: 1; }
    button { background: #4361ee; color: #fff; border: none; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
    li.done .title { text-decoration: line-through; color: #999; }
    .title { flex: 1; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e0e7ff; }
    .badge.high { background: #ffd6d6; } .badge.low { background: #d6f5e0; }
    .del { background: #e63946; padding: 4px 10px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <div class="stats" id="stats"></div>
  <form id="form">
    <input type="text" id="title" placeholder="What needs to be done?" required />
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    const api = '/api/tasks';
    const listEl = document.getElementById('list');

    async function load() {
      const [tasks, stats] = await Promise.all([
        fetch(api).then((r) => r.json()),
        fetch(api + '/stats').then((r) => r.json()),
      ]);
      document.getElementById('stats').textContent =
        stats.total + ' total | ' + stats.completed + ' done | ' + stats.pending + ' pending | ' + stats.completionRate + '% complete';
      listEl.innerHTML = '';
      tasks.forEach((t) => {
        const li = document.createElement('li');
        if (t.completed) li.className = 'done';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.completed;
        cb.onchange = async () => {
          await fetch(api + '/' + t.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: cb.checked }),
          });
          load();
        };

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = t.title;

        const badge = document.createElement('span');
        badge.className = 'badge ' + t.priority;
        badge.textContent = t.priority;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'X';
        del.onclick = async () => {
          await fetch(api + '/' + t.id, { method: 'DELETE' });
          load();
        };

        li.append(cb, title, badge, del);
        listEl.appendChild(li);
      });
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('title');
      await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title.value, priority: document.getElementById('priority').value }),
      });
      title.value = '';
      load();
    };

    load();
  </script>
</body>
</html>
